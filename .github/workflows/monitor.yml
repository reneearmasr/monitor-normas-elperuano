name: Monitor normas El Peruano

on:
  schedule:
    # Cuatro alarmas (hora de Lima): 06:00, 06:40, 07:20 y 08:00, antes del correo de las 09:00.
    # GitHub a veces atrasa o se salta una; la primera que corre envía y las demás no hacen nada
    # (ver "Ver si ya se envió hoy").
    - cron: "0 11 * * *"
    - cron: "40 11 * * *"
    - cron: "20 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Opciones (vacío = --diario). Ej.: --dias 7   |   --desde 01/10/2026 --hasta 22/10/2026   |   --chat-id"
        required: false
        default: ""

permissions:
  contents: write   # para guardar el historial del panel web (docs/)

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ver si ya se envió hoy
        id: hoy
        run: |
          git fetch --quiet origin main
          HOY=$(TZ=America/Lima date +%F)
          ULTIMA=$(git show origin/main:docs/data/ultima_ejecucion.txt 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ULTIMA" = "$HOY" ]; then
            echo "Ya se envió hoy ($HOY); esta alarma de respaldo no hace nada."
            echo "omitir=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.hoy.outputs.omitir != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.hoy.outputs.omitir != 'true'

      - name: Revisar normas, enviar por Telegram y actualizar el panel
        if: steps.hoy.outputs.omitir != 'true'
        env:
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MONITOR_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARGUMENTOS: ${{ inputs.argumentos }}
          PYTHONIOENCODING: utf-8
        run: python monitor_normas.py ${ARGUMENTOS:---diario} --publicar

      - name: Publicar historial en el panel
        if: steps.hoy.outputs.omitir != 'true'
        run: |
          TZ=America/Lima date +%F > docs/data/ultima_ejecucion.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/resumenes
          if git diff --cached --quiet; then
            echo "Sin cambios en el panel."
          else
            git commit -m "Panel: normas al $(TZ=America/Lima date +%d/%m/%Y)"
            git pull --rebase --autostash
            git push
          fi

      - name: Guardar el Word como artefacto
        if: always() && steps.hoy.outputs.omitir != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resumen-normas
          path: resumenes/*.docx
          if-no-files-found: ignore
          retention-days: 30
