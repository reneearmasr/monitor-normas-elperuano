name: Monitor normas El Peruano

on:
  schedule:
    # Todos los días a las 07:30 hora de Lima (12:30 UTC). GitHub puede demorar unos minutos.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Opciones (vacío = --diario). Ej.: --dias 7   |   --desde 01/10/2026 --hasta 22/10/2026   |   --chat-id"
        required: false
        default: ""

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar normas y enviar por Telegram
        env:
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MONITOR_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARGUMENTOS: ${{ inputs.argumentos }}
          PYTHONIOENCODING: utf-8
        run: python monitor_normas.py ${ARGUMENTOS:---diario}

      - name: Guardar el Word como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumen-normas
          path: resumenes/*.docx
          if-no-files-found: ignore
          retention-days: 30
