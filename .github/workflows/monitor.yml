name: Monitor normas El Peruano

on:
  schedule:
    # Todos los días a las 07:30 hora de Lima (12:30 UTC). GitHub puede demorar unos minutos.
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Opciones (vacío = --diario). Ej.: --dias 7   |   --desde 01/10/2026 --hasta 22/10/2026   |   --chat-id"
        required: false
        default: ""

permissions:
  contents: write   # para guardar el historial del panel web (docs/)

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar normas, enviar por Telegram y actualizar el panel
        env:
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MONITOR_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARGUMENTOS: ${{ inputs.argumentos }}
          PYTHONIOENCODING: utf-8
        run: python monitor_normas.py ${ARGUMENTOS:---diario} --publicar

      - name: Publicar historial en el panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/resumenes
          if git diff --cached --quiet; then
            echo "Sin cambios en el panel."
          else
            git commit -m "Panel: normas al $(TZ=America/Lima date +%d/%m/%Y)"
            git pull --rebase --autostash
            git push
          fi

      - name: Guardar el Word como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumen-normas
          path: resumenes/*.docx
          if-no-files-found: ignore
          retention-days: 30
